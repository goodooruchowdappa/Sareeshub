name: Keep Supabase awake
# Free Supabase projects pause after 7 days without activity. This pings the site twice a week.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - run: curl -fsS "${{ vars.SITE_URL }}/api/health"
